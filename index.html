<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Trening na dziś</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one full-height phone screen per step of the session; bottom sheets slide over Przygotowanie */
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --ink:#121212;
  --muted:#6B6B67;
  --faint:#9A9A95;
  --line:#EEEDE8;
  --chip:#F0EFEA;
  --good:#1F5B3D; --good-bg:#E3EFE7; --warn:#7A4A0E; --warn-bg:#F6EBDD;
  --font:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body,a,label,input,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:20px;padding:calc(env(safe-area-inset-top) + 36px) 24px calc(env(safe-area-inset-bottom) + 32px)}
.loading .screen{opacity:.6;pointer-events:none}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.kicker{margin:0;font-size:15px;color:var(--muted)}
.title{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;font-size:16px;line-height:1.45;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{margin:0;font-size:15px;font-weight:500;color:var(--muted)}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.card{background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:11px 18px;width:100%;border:0;background:transparent;text-align:left;color:inherit;min-height:64px}
.row + .row{border-top:1px solid var(--line)}
.row .num{width:16px;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.row .main{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.row .name{font-size:17px;font-weight:500}
.row .sub{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.row .why{font-size:14px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.tag{font-size:13px;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
.tag.up{color:var(--good);background:var(--good-bg)}
.tag.down{color:var(--warn);background:var(--warn-bg)}
.chev{flex:none}
.day-list{display:flex;flex-direction:column;gap:12px}
.day-card{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);border-radius:20px;padding:20px 18px;text-align:left;color:inherit;min-height:96px}
.day-main{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.day-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.day-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
.day-sub{font-size:15px;color:var(--muted)}
.status{font-size:13px;font-weight:500;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--muted);white-space:nowrap}
.status.done{background:var(--good-bg);color:var(--good)}
.status.live{background:var(--ink);color:#FFFFFF}
.day-card.off{opacity:.55}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:15px;text-align:left;align-self:flex-start}

.btn{display:flex;align-items:center;justify-content:center;height:64px;border-radius:32px;border:0;background:var(--ink);color:#FFFFFF;font-size:18px;font-weight:600;width:100%;flex:none;text-decoration:none}
.btn.outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.plain{background:transparent;color:var(--ink);font-weight:500;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.push{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.round-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);font-size:22px;line-height:1;flex:none}
.round-btn:disabled{opacity:.35}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .val{min-width:72px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.choices{display:grid;gap:8px}
.choice{min-height:56px;border:0;border-radius:16px;background:var(--surface);font-size:16px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.choice small{font-size:14px;color:var(--muted);font-weight:400}
.choice.on{background:var(--ink);color:#FFFFFF}
.choice.on small{color:#BDBCB7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--surface);font-size:15px;font-weight:500}
.pill.on{background:var(--ink);color:#FFFFFF}

.big-step{background:var(--surface);border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:space-between}
.big-step button{width:56px;height:56px;border:0;border-radius:28px;background:var(--chip);font-size:28px;line-height:1}
.big-step button:disabled{opacity:.35}
.big-step .v{display:flex;flex-direction:column;align-items:center;gap:2px}
.big-step .v b{font-size:44px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-step .v span{font-size:14px;color:var(--muted)}
.note{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}

/* session */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .mid{font-size:15px;font-weight:500}
.topbar .side{width:44px;text-align:right;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:#E2E0DA}
.segs i.done{background:var(--ink)}
.segs i.cur{background:#A8A7A2}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.center h1{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.bignum{display:flex;flex-direction:column;align-items:center;gap:4px}
.bignum b{font-size:128px;line-height:1;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.bignum span{font-size:17px;color:var(--muted)}
.loadpill{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:10px 18px;font-size:20px;font-weight:500}
.loadpill .dot{width:12px;height:12px;border-radius:6px}
.cue{margin:0;max-width:290px;font-size:16px;line-height:1.5;color:var(--muted)}
.next{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.timer{font-size:96px;line-height:1;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{width:200px;height:4px;border-radius:2px;background:#E2E0DA;overflow:hidden}
.bar i{display:block;height:4px;background:var(--ink);border-radius:2px}
.upnext{background:var(--surface);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.upnext .k{font-size:14px;color:var(--muted)}
.upnext .n{font-size:20px;font-weight:600;letter-spacing:-.01em}

.field{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field textarea{width:100%;border:0;outline:none;resize:none;background:transparent;font-size:16px;line-height:1.45;padding:4px 4px;min-height:72px;text-align:center}
.field textarea::placeholder{color:#8A8984}
.mic{width:100%;height:54px;flex:none;border:0;border-radius:22px;background:var(--chip);display:grid;place-items:center}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.input{width:100%;border:0;border-radius:14px;background:var(--surface);padding:14px 16px;font-size:16px}

.verdict{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.verdict .t{margin:0;font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.verdict p{margin:0;font-size:16px;line-height:1.5;color:#3F3F3C}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{font-size:14px;line-height:1.4;padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{font-size:13px;background:var(--chip);border-radius:8px;padding:3px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
.analysis{font-size:15px;line-height:1.5}
.analysis h4{margin:14px 0 4px;font-size:16px;font-weight:600}
.analysis p{margin:0 0 6px}
.analysis ul{margin:0 0 6px;padding-left:20px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;min-height:56px}
.opt + .opt{border-top:1px solid var(--line)}
.opt label{flex:1;font-size:16px}
.opt small{display:block;color:var(--muted);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#D6D4CE;position:relative;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:transform .15s}
.sw:checked{background:var(--ink)}
.sw:checked::after{transform:translateX(20px)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days .choice{min-height:48px;font-size:14px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(18,18,18,.42)}
.sheet-wrap[hidden]{display:none}
.sheet{position:relative;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:24px;max-height:92%;overflow-y:auto;width:100%;max-width:480px;margin:0 auto}
.grab{align-self:center;width:36px;height:5px;border-radius:3px;background:#D6D4CE;flex:none}
.sheet h2{margin:0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.sheet .sub{margin:6px 0 0;font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="loading">
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden></div>

<script>
"use strict";
const APP_VERSION = "2026-11-11.1";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DAYS = ["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];
const DAYS_SHORT = ["ndz","pon","wt","śr","czw","pt","sob"];
const MONTHS = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dayLabel = d => cap(DAYS[d.getDay()]) + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
const shortDate = s => { const d = parseYmd(s); return DAYS_SHORT[d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1); };
const plural = (n, one, few, many) => n === 1 ? one : (n%10 >= 2 && n%10 <= 4 && (n%100 < 10 || n%100 >= 20)) ? few : many;
const roundsText = n => n + " " + plural(n, "runda", "rundy", "rund");
const CHEV = `<svg class="chev" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9A9A95" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>`;
const XICON = `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#121212" stroke-width="1.6" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>`;
const BACK = `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#121212" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>`;
const DOTS = `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="#121212"><circle cx="3.5" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="14.5" cy="9" r="1.6"/></svg>`;
const MIC = `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#121212" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="1.5" width="6" height="10" rx="3"/><path d="M3 8.5a6 6 0 0 0 12 0M9 14.5v2.5"/></svg>`;

/* ---------- equipment & loads ---------- */
const EQUIP = [
  {id:"kb4", label:"Kettlebell 4 kg"}, {id:"kb8", label:"Kettlebell 8 kg"}, {id:"kb16", label:"Kettlebell 16 kg"}, {id:"kb20", label:"Kettlebell 20 kg"},
  {id:"db15", label:"Hantle 2 × 15 kg"}, {id:"db225", label:"Hantle 2 × 22,5 kg"}, {id:"mb9", label:"Piłka lekarska 9 kg"},
  {id:"rings", label:"Kółka gimnastyczne"}, {id:"pullbar", label:"Drążek"}, {id:"bands", label:"Gumy oporowe"},
  {id:"box", label:"Skrzynia 50 / 60 / 75 cm"}, {id:"rower", label:"Wioślarz"}, {id:"rope", label:"Skakanka"},
  {id:"barbell", label:"Sztanga i talerze", note:"Do wycofania. Domyślnie wyłączona, zamienniki jej nie używają."}
];
const DEFAULT_EQUIP = Object.fromEntries(EQUIP.map(e => [e.id, e.id !== "barbell"]));
const LOADS = {
  bw:{label:"Bodyweight"},
  kb4:{label:"4 kg", color:"#A3ABB4", eq:"kb4"}, kb8:{label:"8 kg", color:"#E98FB8", eq:"kb8"},
  kb16:{label:"16 kg", color:"#E8B923", eq:"kb16"}, kb20:{label:"20 kg", color:"#7B4DB0", eq:"kb20"},
  db15:{label:"15 kg DB", color:"#2A2D32", eq:"db15"}, db15x2:{label:"2 × 15 kg", color:"#2A2D32", eq:"db15"},
  db225:{label:"22,5 kg DB", color:"#2A2D32", eq:"db225"}, db225x2:{label:"2 × 22,5 kg", color:"#2A2D32", eq:"db225"},
  mb9:{label:"9 kg ball", color:"#7B5639", eq:"mb9"},
  band:{label:"Band", eq:"bands"}, barbell:{label:"Barbell", eq:"barbell"}
};

/* ---------- exercises ---------- */
const PATTERNS = {shoulder:"barki", vpush:"wyciskanie nad głowę", hpull:"przyciąganie", hinge:"zawias biodrowy", hpush:"pchanie poziome", lunge:"jedna noga",
  "mob-squat":"głęboki przysiad", "mob-hip":"biodra", "mob-ankle":"kostki i łydki", "mob-back":"tył ciała", "mob-tspine":"odcinek piersiowy i barki"};
const EX = {};
const X = (id, o) => { EX[id] = Object.assign({id, loads:["bw"], side:false, timed:false, req:[]}, o); };
// circuit (plan)
X("kb-halo", {name:"KB Halo", pattern:"shoulder", loads:["kb4","kb8","kb16"], side:true, def:["kb8",5], cue:"Kettel blisko głowy, żebra w dół, brzuch napięty."});
X("kb-clean-press", {name:"KB Clean & Press", pattern:"vpush", loads:["kb8","kb16","kb20"], side:true, def:["kb16",5], cue:"Opuszczaj przez 3 sekundy. Push press dozwolony."});
X("kb-strict-press", {name:"KB Clean & Strict Press", pattern:"vpush", loads:["kb8","kb16","kb20"], side:true, def:["kb16",3], cue:"Bez pomocy nóg. Opuszczanie 3 sekundy."});
X("ring-row", {name:"Ring Row", pattern:"hpull", req:["rings"], def:["bw",8], cue:"Ciało w jednej linii, łopatki ściągnięte."});
X("ring-row-box", {name:"Ring Row", tag:"Feet on box", pattern:"hpull", req:["rings","box"], def:["bw",8], cue:"Stopy na skrzyni, ciało poziomo."});
X("pullup-negative", {name:"Pull-up Negative", pattern:"hpull", req:["pullbar"], def:["bw",3], cue:"Wskakujesz nad drążek, schodzisz przez 5 sekund."});
X("band-pullup", {name:"Band-assisted Pull-up", pattern:"hpull", req:["pullbar","bands"], def:["bw",5], cue:"Guma pod kolanem albo stopą, pełny zakres."});
X("pullup", {name:"Pull-up", pattern:"hpull", req:["pullbar"], def:["bw",3], cue:"Pełny zwis na dole, broda nad drążkiem."});
X("archer-ring-row", {name:"Archer Ring Row", pattern:"hpull", req:["rings"], side:true, def:["bw",5], cue:"Jedna ręka ciągnie, druga prowadzi bokiem."});
X("sa-ring-row", {name:"Single-arm Ring Row", pattern:"hpull", req:["rings"], side:true, def:["bw",5], cue:"Bez rotacji tułowia."});
X("kb-swing", {name:"KB Swing", pattern:"hinge", loads:["kb16","kb20"], def:["kb20",15], cue:"Ruch idzie z bioder. Ramiona tylko prowadzą kettla."});
X("kb-swing-1a", {name:"One-arm KB Swing", pattern:"hinge", loads:["kb16","kb20"], side:true, def:["kb20",8], cue:"Barki równo, bez skrętu tułowia."});
X("incline-pushup-75", {name:"Incline Push-up", tag:"Box 75 cm", pattern:"hpush", req:["box"], def:["bw",10], cue:"Dłonie na krawędzi skrzyni, ciało prosto."});
X("knee-pushup", {name:"Knee Push-up", pattern:"hpush", def:["bw",8], cue:"Ciało prosto od kolan do głowy."});
X("pushup-negative", {name:"Push-up Negative", pattern:"hpush", def:["bw",5], cue:"3 sekundy w dół, wracasz z kolan."});
X("incline-pushup-50", {name:"Incline Push-up", tag:"Box 50 cm", pattern:"hpush", req:["box"], def:["bw",8], cue:"Dłonie na krawędzi skrzyni, ciało prosto."});
X("pushup", {name:"Push-up", pattern:"hpush", def:["bw",5], cue:"Łokcie około 45° od tułowia."});
X("ring-dip", {name:"Ring Dip", pattern:"hpush", req:["rings"], def:["bw",3], cue:"Kółka przy biodrach, barki w dół."});
X("bss", {name:"Bulgarian Split Squat", pattern:"lunge", loads:["bw","kb8","kb16","kb20","db15x2","db225x2"], side:true, def:["kb16",6], cue:"Tylna stopa na skrzyni 50 cm, tułów lekko w przód."});
// alternatives
const A = (id, o) => X(id, Object.assign({alt:true}, o));
A("band-pull-apart", {name:"Band Pull-Apart", pattern:"shoulder", loads:["band"], def:["band",15], rel:"podobnie", why:"Otwiera barki i budzi łopatki bez ciężaru."});
A("band-dislocate", {name:"Band Shoulder Dislocate", pattern:"shoulder", loads:["band"], def:["band",10], rel:"podobnie", why:"Pełny zakres w barkach."});
A("scap-pullup", {name:"Scapular Pull-up", pattern:"shoulder", req:["pullbar"], def:["bw",8], rel:"podobnie", why:"Zwis i praca samymi łopatkami."});
A("kb-arm-bar", {name:"KB Arm Bar", pattern:"shoulder", loads:["kb8","kb16"], side:true, def:["kb8",3], rel:"trudniej", why:"Stabilizacja barku z rotacją tułowia."});

const UNKNOWN = {id:"?", name:"Nieznane ćwiczenie", pattern:"", loads:["bw"], side:false, timed:false, req:[], def:["bw",5]};
const EX_ALIAS = {"ring-row-60":"ring-row", "ring-row-45":"ring-row", "ring-row-30":"ring-row", "ring-row-flat":"ring-row"};
const LADDERS = {
  hpull:["ring-row","ring-row-box","pullup-negative","band-pullup","pullup"],
  hpush:["incline-pushup-75","knee-pushup","pushup-negative","pushup"],
  vpush:["kb-clean-press","kb-strict-press"],
  hinge:["kb-swing","kb-swing-1a"]
};
function exOf(id){
  if (EX_ALIAS[id]) id = EX_ALIAS[id];
  if (EX[id]) return EX[id];
  if (id && id.startsWith("c:")){ const c = (S.profile.custom || {})[id.slice(2)]; if (c) return Object.assign({id, loads:[c.load], side:!!c.side, timed:!!c.timed, req:[], def:[c.load, c.reps], alt:true}, c); }
  return UNKNOWN;
}
const eqOk = e => !!S.profile.equip[e];
const loadsOf = ex => ex.loads.filter(l => LOADS[l] && (!LOADS[l].eq || eqOk(LOADS[l].eq)));
const exAvailable = ex => ex.req.every(eqOk) && loadsOf(ex).length > 0;
const loadLabel = (ex, load) => load === "bw" ? (ex.tag || "Bodyweight") : (ex.tag ? ex.tag + " · " : "") + (LOADS[load]?.label || load);
const sideTxt = ex => ex.side ? " per side" : "";
function doseText(exId, load, reps){
  const ex = exOf(exId);
  if (ex.timed) return (load === "bw" && !ex.tag ? "" : loadLabel(ex, load) + " · ") + reps + " s" + sideTxt(ex);
  return loadLabel(ex, load) + " × " + reps + sideTxt(ex);
}
const shortDose = (exId, reps) => { const ex = exOf(exId); return ex.timed ? `${ex.name} · ${reps} s${sideTxt(ex)}` : `${ex.name} × ${reps}${sideTxt(ex)}`; };
const dotHtml = load => LOADS[load]?.color ? `<span class="dot" style="background:${LOADS[load].color}"></span>` : "";

function defaultProfile(){
  return {v:2, schedule:[1,3,5], rounds:3, rest:120, warmStart:"rope", equip:{...DEFAULT_EQUIP}, slots:DEFAULT_SLOTS.map(s => ({...s})), custom:{}, analysis:null};
}
function mergeProfile(p){
  const d = defaultProfile();
  if (!p || typeof p !== "object") return d;
  const out = {...d, schedule:Array.isArray(p.schedule) ? p.schedule : d.schedule, rounds:p.rounds || d.rounds, rest:p.rest || d.rest,
    warmStart:p.warmStart || d.warmStart, equip:{...d.equip, ...(p.equip || {})}, custom:p.custom || {}, analysis:p.analysis || null, lastBackup:p.lastBackup || null, updatedAt:p.updatedAt || 0, v:2};
  if (p.v === 2 && Array.isArray(p.slots)){
    const byKey = Object.fromEntries(p.slots.map(s => [s.key, s]));
    out.slots = d.slots.map(s => byKey[s.key] && byKey[s.key].ex ? {...s, ...byKey[s.key]} : s);
    out.slots.forEach(sl => { if (EX_ALIAS[sl.ex]) sl.ex = EX_ALIAS[sl.ex]; });
  }
  return out;
}

/* ---------- state ---------- */
const S = {profile:defaultProfile(), sessions:{}, reviews:{}, kind:null, view:"home", sheet:null, loaded:false, busy:false, syncErr:null, notice:null, pending:{}, micHint:false};
const slotsOf = g => S.profile.slots.filter(s => s.group === g);
const slotByKey = k => S.profile.slots.find(s => s.key === k);
const today = () => ymd(new Date());
const isStrengthDay = dateStr => S.profile.schedule.includes(parseYmd(dateStr).getDay());
const sessionId = kind => kind === "strength" ? today() : today() + "-mob";
function nextStrengthLabel(fromToday = false){
  const d = new Date();
  for (let i = fromToday ? 0 : 1; i <= 7; i++){ const n = new Date(d); n.setDate(d.getDate()+i); if (S.profile.schedule.includes(n.getDay())) return DAYS[n.getDay()] + ", " + n.getDate() + " " + MONTHS[n.getMonth()]; }
  return "brak w planie";
}
function fitLoad(ex, load){ const ls = loadsOf(ex); return ls.includes(load) ? load : (ls.includes(ex.def[0]) ? ex.def[0] : ls[0] || "bw"); }
function buildSession(kind){
  const group = kind === "strength" ? "circuit" : "mobility";
  return {v:2, id:sessionId(kind), date:today(), kind, status:"prep", touched:false, rounds: kind === "strength" ? S.profile.rounds : 1,
    finishedAt:null, note:"",
    items: slotsOf(group).map(s => { const ex = exOf(s.ex), load = fitLoad(ex, s.load);
      return {key:s.key, ex:s.ex, load, reps:s.reps, planEx:s.ex, planLoad:load, planReps:s.reps, swap:null, done:0}; })};
}
function current(){
  const kind = S.kind || (isStrengthDay(today()) ? "strength" : "mobility");
  const id = sessionId(kind);
  let s = S.sessions[id];
  if (!s || s.v !== 2){ s = buildSession(kind); S.sessions[id] = s; }
  else if (s.status === "prep" && !s.touched){ const fresh = buildSession(kind); Object.assign(s, {items:fresh.items, rounds:fresh.rounds}); }
  return s;
}

/* ---------- storage: on this phone ---------- */
const KEY_P = "trening:v2:profile", KEY_S = "trening:v2:sessions";
const Store = {
  ok:false,
  init(){
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); this.ok = true; } catch(e){ this.ok = false; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  },
  load(){
    if (!this.ok) return {profile:null, sessions:{}};
    try { return {profile:JSON.parse(localStorage.getItem(KEY_P) || "null"), sessions:JSON.parse(localStorage.getItem(KEY_S) || "{}")}; }
    catch(e){ return {profile:null, sessions:{}}; }
  },
  fail(){ S.syncErr = "Nie udało się zapisać danych w telefonie."; },
  saveProfile(){ if (!this.ok) return; try { localStorage.setItem(KEY_P, JSON.stringify(S.profile)); S.syncErr = null; } catch(e){ this.fail(); } },
  saveSession(s){
    if (!this.ok) return;
    try { const all = JSON.parse(localStorage.getItem(KEY_S) || "{}"); all[s.id] = JSON.parse(JSON.stringify(s)); localStorage.setItem(KEY_S, JSON.stringify(all)); S.syncErr = null; }
    catch(e){ this.fail(); }
  },
  replaceAll(profile, sessions){ localStorage.setItem(KEY_P, JSON.stringify(profile)); localStorage.setItem(KEY_S, JSON.stringify(sessions)); }
};
const debouncers = {};
function commitSession(s, later = false){
  s.touched = true; s.updatedAt = Date.now();
  clearTimeout(debouncers[s.id]);
  const save = () => { Store.saveSession(s); Sync.queue(s.id); };
  if (later) debouncers[s.id] = setTimeout(save, 700); else save();
}
function commitProfile(){ S.profile.updatedAt = Date.now(); Store.saveProfile(); Sync.queue("profile"); }

/* ---------- sync with Google Sheets (Apps Script web app) ---------- */
const KEY_URL = "trening:sync:url", KEY_Q = "trening:sync:queue";
const Sync = {
  url:null, q:new Set(), timer:null, busy:false, last:null, err:null,
  init(){
    try { this.url = localStorage.getItem(KEY_URL) || null; (JSON.parse(localStorage.getItem(KEY_Q) || "[]")).forEach(x => this.q.add(x)); } catch(e){}
    window.addEventListener("online", () => this.flush());
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.flush(); });
  },
  saveQ(){ try { localStorage.setItem(KEY_Q, JSON.stringify([...this.q])); } catch(e){} },
  queue(id){ if (!this.url) return; this.q.add(id); this.saveQ(); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); },
  row(x){
    return {session:x, items:(x.items || []).map(it => exOf(it.ex).name + " " + doseText(it.ex, it.load, it.reps) + (it.swap ? " [zamiast " + exOf(it.swap.from).name + "]" : "")).join("; ")};
  },
  async flush(){
    if (!this.url || this.busy || !this.q.size || !navigator.onLine) return;
    this.busy = true;
    const ids = [...this.q];
    const body = {sessions: ids.filter(id => id !== "profile" && S.sessions[id] && S.sessions[id].touched).map(id => this.row(S.sessions[id]))};
    if (ids.includes("profile")){ body.profile = S.profile; body.planText = S.profile.slots.map(sl => [(sl.group === "circuit" ? "Obwód: " : "Mobilność: ") + exOf(sl.ex).name, doseText(sl.ex, sl.load, sl.reps)]); }
    try {
      const res = await fetch(this.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "błąd arkusza");
      ids.forEach(id => this.q.delete(id)); this.saveQ(); this.last = Date.now(); this.err = null;
    } catch(e){ this.err = "Nie udało się wysłać do arkusza. Spróbuję ponownie."; }
    this.busy = false;
    if (S.view === "settings") render();
    if (this.q.size && !this.err) this.flush();
  },
  async pull(){
    if (!this.url || !navigator.onLine) return false;
    try {
      const res = await fetch(this.url, {method:"GET"});
      const j = await res.json();
      if (!j.ok) throw new Error("bad");
      let changed = false;
      for (const [id, r] of Object.entries(j.sessions || {})){
        const l = S.sessions[id];
        if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ S.sessions[id] = r; changed = true; }
      }
      for (const [id, l] of Object.entries(S.sessions)){
        const r = (j.sessions || {})[id];
        if (l.v === 2 && l.touched && (!r || (l.updatedAt || 0) > (r.updatedAt || 0))) this.q.add(id);
      }
      if (Array.isArray(j.reviews)){
        const rv = {}; j.reviews.forEach(r => { if (r && r.id) rv[r.id] = r; });
        if (JSON.stringify(rv) !== JSON.stringify(S.reviews)){ S.reviews = rv; changed = true; try { localStorage.setItem("trening:reviews", JSON.stringify(rv)); } catch(e){} }
      }
      if (j.profile && (j.profile.updatedAt || 0) > (S.profile.updatedAt || 0)){ S.profile = mergeProfile(j.profile); changed = true; }
      else if (!j.profile || (S.profile.updatedAt || 0) > (j.profile.updatedAt || 0)) this.q.add("profile");
      this.saveQ();
      if (changed) Store.replaceAll(S.profile, S.sessions);
      this.last = Date.now(); this.err = null;
      this.flush();
      return changed;
    } catch(e){ this.err = "Nie mogę połączyć się z arkuszem. Sprawdź adres i internet."; return false; }
  },
  async connect(url){
    this.url = url; try { localStorage.setItem(KEY_URL, url); } catch(e){}
    const before = this.err; await this.pull();
    if (!this.err){ Object.keys(S.sessions).forEach(id => { if (S.sessions[id].touched) this.q.add(id); }); this.q.add("profile"); this.saveQ(); this.flush(); }
    return !this.err;
  },
  disconnect(){ this.url = null; this.q.clear(); this.err = null; try { localStorage.removeItem(KEY_URL); localStorage.removeItem(KEY_Q); } catch(e){} }
};

/* ---------- views ---------- */
const CLAUDE_TAG_DAYS = 7;
function itemRow(it, i, tappable){
  const ex = exOf(it.ex), sl = slotByKey(it.key);
  const changed = it.ex !== it.planEx || it.load !== it.planLoad || it.reps !== it.planReps;
  const byClaude = sl && sl.claudeAt && Date.now() - sl.claudeAt < CLAUDE_TAG_DAYS * 86400000 && sl.ex === it.ex && sl.load === it.load && sl.reps === it.reps;
  const tag = it.swap ? `<span class="tag">zamiana na dziś</span>` : changed ? `<span class="tag">zmienione</span>` : byClaude ? `<span class="tag up">od Claude</span>` : "";
  const inner = `${i != null ? `<span class="num">${i+1}</span>` : ""}<span class="main"><span class="name">${esc(ex.name)}</span><span class="sub">${dotHtml(it.load)}${esc(doseText(it.ex, it.load, it.reps))}</span></span>${tag}${tappable ? CHEV : ""}`;
  return tappable ? `<button class="row" data-act="edit" data-key="${it.key}">${inner}</button>` : `<div class="row">${inner}</div>`;
}
const planItems = group => slotsOf(group).map(sl => ({key:sl.key, ex:sl.ex, load:sl.load, reps:sl.reps, planEx:sl.ex, planLoad:sl.load, planReps:sl.reps}));
function sessionFor(kind){ const x = S.sessions[sessionId(kind)]; return x && x.v === 2 ? x : null; }
const reviewFor = id => (S.reviews || {})[id] || null;
function latestReview(){ return Object.values(S.reviews || {}).sort((a, b) => String(b.date + b.id).localeCompare(String(a.date + a.id)))[0] || null; }
function seenReview(){ try { return localStorage.getItem("trening:seen-review") || ""; } catch(e){ return ""; } }
function reviewHtml(r, withOk){
  return `<section class="verdict"><p class="kicker" style="margin:0">Ocena od Claude · ${esc(shortDate(String(r.date).slice(0, 10)))}</p><p class="t">${esc(r.title || "Ocena")}</p>
    ${r.text ? `<p>${esc(r.text)}</p>` : ""}${r.changes ? `<p class="note" style="color:var(--ink)"><strong>Zmiany w planie:</strong> ${esc(r.changes)}</p>` : ""}
    ${withOk ? `<button class="btn outline" style="height:52px;font-size:16px" data-act="seen" data-id="${esc(r.id)}">OK</button>` : ""}</section>`;
}
function summaryLine(s){
  if (s.kind === "strength") return roundsText(s.rounds) + " · " + s.items.length + " " + plural(s.items.length, "ćwiczenie", "ćwiczenia", "ćwiczeń");
  return s.items.length + " " + plural(s.items.length, "ćwiczenie", "ćwiczenia", "ćwiczeń");
}
function renderHome(){
  const d = new Date(), sd = isStrengthDay(today()), st = sessionFor("strength"), mb = sessionFor("mobility");
  const card = (kind, title, sub, x, enabled) => {
    const done = x && x.status === "done";
    const inner = `<span class="day-main"><span class="day-top"><span class="day-title">${title}</span>${enabled ? `<span class="status ${done ? "done" : ""}">${done ? "✓ Zrobione" : "Do zrobienia"}</span>` : ""}</span><span class="day-sub">${esc(sub)}</span></span>`;
    return enabled ? `<button class="day-card" data-act="open" data-kind="${kind}">${inner}${CHEV}</button>` : `<div class="day-card off">${inner}</div>`;
  };
  let stSub;
  if (!sd) stSub = "Dziś wolne. Następny: " + nextStrengthLabel() + ".";
  else if (st && st.status === "done") stSub = reviewFor(st.id) ? "Ocena od Claude jest gotowa." : Sync.url ? "Notatka zapisana. Claude oceni trening po południu albo wieczorem." : "Notatka zapisana.";
  else stSub = roundsText(S.profile.rounds) + " · " + slotsOf("circuit").length + " ćwiczeń";
  const mbSub = mb && mb.status === "done" ? "Zrobione na dziś." : slotsOf("mobility").length + " ćwiczeń · około 10 min";
  const doneN = [sd ? st : null, mb].filter(x => x && x.status === "done").length, total = sd ? 2 : 1;
  const lead = doneN === total ? "Wszystko na dziś zrobione." : doneN ? "Zrobione " + doneN + " z " + total + "." : total === 2 ? "Dziś trening siłowy i mobilność." : "Dziś mobilność.";
  const r = latestReview();
  return `<section class="screen"><header class="head"><div><p class="kicker">${dayLabel(d)}</p><h1 class="title">Dzisiaj</h1><p class="lead">${lead}</p></div><button class="icon-btn" data-act="menu" aria-label="Więcej">${DOTS}</button></header>
    ${S.syncErr ? `<p class="banner">${esc(S.syncErr)}</p>` : ""}
    <div class="day-list">${card("strength", "Trening siłowy", stSub, st, sd)}${card("mobility", "Mobilność", mbSub, mb, true)}</div>
    ${r && r.id !== seenReview() ? reviewHtml(r, true) : ""}
    ${!Sync.url ? `<button class="linkbtn" data-act="go" data-v="settings">Połącz arkusz Google, żeby Claude oceniał treningi i zmieniał plan.</button>` : ""}</section>`;
}
function renderPrep(){
  const s = current(), strength = s.kind === "strength";
  const head = title => `<div class="topbar"><button class="icon-btn" data-act="home" aria-label="Wróć do dnia">${BACK}</button></div><header class="head"><div><p class="kicker">${strength ? "Trening siłowy" : "Mobilność"} · ${dayLabel(new Date())}</p><h1 class="title">${title}</h1></div></header>`;
  if (s.status === "done"){
    const r = reviewFor(s.id);
    return `<section class="screen">${head("Zrobione")}
      ${s.note ? `<section class="sec"><h2 class="sec-h">Twoja notatka</h2><div class="verdict"><p>${esc(s.note)}</p></div></section>` : ""}
      ${strength ? (r ? reviewHtml(r, false) : `<p class="note">${Sync.url ? "Claude oceni ten trening i w razie potrzeby zmieni plan. Ocena pojawi się na ekranie Dzisiaj." : "Połącz arkusz Google w ustawieniach, żeby Claude oceniał treningi."}</p>`) : ""}
      <section class="sec"><h2 class="sec-h">${strength ? "Plan na następny trening · " + esc(nextStrengthLabel()) : "Mobilność na następny raz"}</h2><div class="card">${planItems(strength ? "circuit" : "mobility").map((it, i) => itemRow(it, strength ? i : null, false)).join("")}</div></section>
      <div class="push"><button class="btn plain" data-act="note">Popraw notatkę</button></div></section>`;
  }
  if (strength){
    const ws = WARM_START.find(w => w.id === S.profile.warmStart && eqOk(w.eq)) || WARM_START.find(w => eqOk(w.eq));
    const warmNames = [ws ? ws.name : null, ...WARMUP.map(w => w.name)].filter(Boolean).join(", ");
    return `<section class="screen">${head("Plan na dziś")}
      <section class="sec"><h2 class="sec-h">Rozgrzewka</h2>
        <div class="card"><button class="row" data-act="warmup"><span class="main"><span class="name">Około 2 minut, bez przerw</span><span class="sub">${esc(warmNames)}</span></span>${CHEV}</button></div></section>
      <section class="sec"><div class="sec-row"><h2 class="sec-h">Obwód</h2>
        <div class="stepper" role="group" aria-label="Liczba rund"><button class="round-btn" data-act="rounds" data-d="-1" aria-label="Mniej rund" ${s.rounds <= 1 ? "disabled" : ""}>−</button><span class="val">${roundsText(s.rounds)}</span><button class="round-btn" data-act="rounds" data-d="1" aria-label="Więcej rund" ${s.rounds >= 5 ? "disabled" : ""}>+</button></div></div>
        <div class="card">${s.items.map((it, i) => itemRow(it, i, true)).join("")}</div></section>
      <div class="push"><button class="btn" data-act="note">Po treningu: notatka</button></div></section>`;
  }
  return `<section class="screen">${head("Plan na dziś")}
    <section class="sec"><h2 class="sec-h">Około 10 minut</h2><div class="card">${s.items.map(it => itemRow(it, null, true)).join("")}</div></section>
    <div class="push"><button class="btn" data-act="note">Zrobione</button></div></section>`;
}
function renderNote(){
  const s = current(), strength = s.kind === "strength";
  return `<section class="screen"><div class="topbar"><button class="icon-btn" data-act="back-prep" aria-label="Wróć do planu">${BACK}</button></div>
    <header class="head"><div><p class="kicker">${strength ? "Trening siłowy" : "Mobilność"}</p><h1 class="title">Jak poszło?</h1>
      <p class="lead">${strength ? "Opowiedz o całym treningu: ile rund, co było łatwe, co trudne, co zmieniłeś w trakcie. Claude rozbierze to na ćwiczenia i w razie potrzeby zmieni plan." : "Krótko, jeśli coś było inaczej. Możesz zostawić puste."}</p></div></header>
    <div class="field"><button class="mic" data-act="mic" aria-label="Dyktuj notatkę">${MIC}</button><textarea id="sessionNote" data-note="1" rows="9" style="text-align:left" placeholder="Podyktuj lub napisz">${esc(s.note)}</textarea></div>
    ${S.micHint ? `<p class="hint">Dotknij mikrofonu na klawiaturze iOS i mów. Tekst trafi do notatki.</p>` : ""}
    <div class="push"><button class="btn" data-act="finish">Zapisz i zakończ</button></div></section>`;
}
const backHead = title => `<header class="head"><div style="flex-direction:row;align-items:center;gap:12px"><button class="icon-btn" data-act="home" aria-label="Wróć">${BACK}</button><h1 class="title" style="font-size:28px">${title}</h1></div></header>`;
function doneSessions(){ return Object.values(S.sessions).filter(s => s.v === 2 && s.status === "done").sort((a, b) => (b.date + b.kind).localeCompare(a.date + a.kind)); }
function renderHistory(){
  const list = doneSessions();
  if (!list.length) return `<section class="screen">${backHead("Historia")}<p class="lead">Po pierwszej sesji zobaczysz tu plan, swoją notatkę i ocenę od Claude.</p></section>`;
  return `<section class="screen">${backHead("Historia")}${list.map(s => {
    const r = reviewFor(s.id);
    return `<section class="sec"><h2 class="sec-h">${esc(shortDate(s.date))} · ${s.kind === "strength" ? "trening siłowy · " + roundsText(s.rounds) : "mobilność"}</h2><div class="card">
      ${s.items.map(it => `<div class="row"><span class="main"><span class="name">${esc(exOf(it.ex).name)}</span><span class="sub">${dotHtml(it.load)}${esc(doseText(it.ex, it.load, it.reps))}</span></span>${it.swap ? `<span class="tag">zamiana</span>` : ""}</div>`).join("")}
      ${s.note ? `<div class="row"><span class="main"><span class="why">${esc(s.note)}</span></span></div>` : ""}
      ${r ? `<div class="row"><span class="main"><span class="name">${esc(r.title || "Ocena")}</span>${r.text ? `<span class="why">${esc(r.text)}</span>` : ""}${r.changes ? `<span class="why">Zmiany: ${esc(r.changes)}</span>` : ""}</span></div>` : ""}</div></section>`; }).join("")}</section>`;
}
function renderProgress(){
  const from = new Date(); from.setDate(from.getDate() - 27);
  const recent = doneSessions().filter(s => s.date >= ymd(from));
  const str = recent.filter(s => s.kind === "strength").length, mob = recent.filter(s => s.kind === "mobility").length;
  const hist = doneSessions().filter(s => s.kind === "strength").reverse();
  let h = `<section class="screen">${backHead("Progres")}
    <div class="stats"><div class="stat"><b>${str}</b><span>treningi siłowe w 4 tygodnie</span></div><div class="stat"><b>${mob}</b><span>sesje mobilności w 4 tygodnie</span></div></div>
    <section class="sec"><h2 class="sec-h">Obwód: plan teraz i ostatnie treningi</h2><div class="card">`;
  for (const sl of slotsOf("circuit")){
    const vals = hist.map(s => ({s, it:s.items.find(i => i.key === sl.key)})).filter(x => x.it).slice(-6);
    h += `<div class="row" style="align-items:flex-start"><span class="main"><span class="name">${esc(exOf(sl.ex).name)}</span><span class="sub">${dotHtml(sl.load)}${esc(doseText(sl.ex, sl.load, sl.reps))}</span>
      ${vals.length ? `<span class="hist">${vals.map(x => `<span>${esc(shortDate(x.s.date))}: ${esc((x.it.ex !== sl.ex ? exOf(x.it.ex).name + " " : "") + (LOADS[x.it.load]?.color ? LOADS[x.it.load].label + " " : "") + "× " + x.it.reps)}</span>`).join("")}</span>` : ""}</span></div>`;
  }
  return h + `</div></section></section>`;
}

    <section class="sec"><h2 class="sec-h">Sprzęt</h2><div class="card">${EQUIP.map(e => `<div class="opt"><label for="eq-${e.id}">${esc(e.label)}${e.note ? `<small>${esc(e.note)}</small>` : ""}</label><input type="checkbox" class="sw" id="eq-${e.id}" data-eq="${e.id}" ${p.equip[e.id] ? "checked" : ""}></div>`).join("")}</div></section>

         ${Sync.err ? `<p class="banner">${esc(Sync.err)}</p>` : ""}<button class="btn outline" data-act="sync-on" ${S.busy ? "disabled" : ""}>${S.busy ? "Łączę…" : "Połącz"}</button>`}</section>
    <section class="sec"><h2 class="sec-h">Dane</h2><p class="note">${Sync.url ? "Dane są w telefonie i w arkuszu." : "Wszystko jest zapisane tylko w tej aplikacji na tym telefonie. Usunięcie ikony z ekranu głównego usuwa też dane."} ${backupAgeDays() === null ? "Nie masz jeszcze kopii zapasowej." : "Ostatnia kopia: " + (backupAgeDays() === 0 ? "dziś" : backupAgeDays() + " " + plural(backupAgeDays(), "dzień", "dni", "dni") + " temu") + "."}</p>

/* ---------- sheets ---------- */
function sheetHtml(){
  const sh = S.sheet; if (!sh) return "";
  const s = current();
  if (sh.type === "edit"){
    const it = s.items.find(i => i.key === sh.key), ex = exOf(it.ex), idx = s.items.indexOf(it), slot = slotByKey(it.key);
    const loads = loadsOf(ex), step = ex.timed ? 15 : 1;
    const variants = it.swap ? [] : (LADDERS[slot.pattern] || []).filter(id => EX[id] && exAvailable(EX[id]));
    const diff = it.load !== it.planLoad || it.ex !== it.planEx ? "inaczej niż w planie" : it.reps === it.planReps ? "jak w planie" : (it.reps > it.planReps ? "+" : "−") + Math.abs(it.reps - it.planReps) + (ex.timed ? " s" : "") + " względem planu";
    const cols = Math.min(3, loads.length);
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Zmiana ćwiczenia"><span class="grab" aria-hidden="true"></span>
      <header><h2>${esc(ex.name)}</h2><p class="sub">${s.kind === "strength" ? "Obwód, ćwiczenie " + (idx+1) + " z " + s.items.length : "Mobilność"} · w planie ${esc(exOf(it.planEx).name + " " + doseText(it.planEx, it.planLoad, it.planReps))}</p>
        ${slot && slot.claudeNote && !it.swap ? `<p class="sub">Od Claude: ${esc(slot.claudeNote)}</p>` : ""}</header>
      ${variants.length > 1 ? `<section class="sec"><h3 class="sec-h">Wariant</h3><div class="chips">${variants.map(id => { const v = EX[id];
        return `<button class="pill ${it.ex === id ? "on" : ""}" data-act="set-variant" data-ex="${id}" aria-pressed="${it.ex === id}">${esc(v.name + (v.tag ? " (" + v.tag + ")" : ""))}</button>`; }).join("")}</div></section>` : ""}
      ${loads.length > 1 ? `<section class="sec"><h3 class="sec-h">Ciężar</h3><div class="choices" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${loads.map(l =>
        `<button class="choice ${it.load === l ? "on" : ""}" style="flex-direction:row;gap:8px" data-act="set-load" data-l="${l}" aria-pressed="${it.load === l}">${dotHtml(l)}${esc(LOADS[l].label)}</button>`).join("")}</div></section>` : ""}
      <section class="sec"><h3 class="sec-h">${ex.timed ? "Czas" : "Powtórzenia"}${s.kind === "strength" ? " w rundzie" : ""}${ex.side ? " (per side)" : ""}</h3>
        <div class="big-step"><button data-act="reps" data-d="-${step}" aria-label="Mniej" ${it.reps - step < 1 ? "disabled" : ""}>−</button><span class="v"><b>${it.reps}${ex.timed ? " s" : ""}</b><span>${esc(diff)}</span></span><button data-act="reps" data-d="${step}" aria-label="Więcej">+</button></div></section>
      <p class="note">${it.swap ? "To zamiana tylko na dziś. Plan się nie zmienia." : "Zmiana zostaje w planie na następne treningi."}</p>
      <div class="card"><button class="row" data-act="swap" style="min-height:56px"><span class="main"><span class="name" style="font-weight:400">${it.swap ? "Wróć do planu albo zamień na inne" : "Zamień na inne ćwiczenie (tylko dziś)"}</span></span>${CHEV}</button></div>
      <button class="btn" data-act="close">Gotowe</button></div>`;
  }
  if (sh.type === "swap"){
    const it = s.items.find(i => i.key === sh.key), slot = slotByKey(sh.key);
    const lad = LADDERS[slot.pattern] || [];
    const order = {"łatwiej":1, "podobnie":2, "trudniej":3};
    const opts = Object.values(EX).filter(e => e.pattern === slot.pattern && e.id !== it.ex && exAvailable(e) && (e.id === slot.ex || !lad.includes(e.id)))
      .sort((a, b) => (a.id === slot.ex ? -1 : a.alt ? order[a.rel] || 4 : 0) - (b.id === slot.ex ? -1 : b.alt ? order[b.rel] || 4 : 0));
    const optRow = e => { const load = e.id === slot.ex ? fitLoad(e, slot.load) : fitLoad(e, e.def[0]), reps = e.id === slot.ex ? slot.reps : e.def[1];
      return `<button class="row" data-act="pick" data-ex="${esc(e.id)}"><span class="main"><span class="name">${esc(e.name)}</span><span class="sub">${dotHtml(load)}${esc(doseText(e.id, load, reps))}</span>${e.why ? `<span class="why">${esc(e.why)}</span>` : ""}</span><span class="tag">${e.id === slot.ex ? "z planu" : e.alt ? esc(e.rel || "zamiennik") : "wariant"}</span></button>`; };
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Zamiana ćwiczenia"><span class="grab" aria-hidden="true"></span>
      <header class="head"><div><h2>Zamień</h2><p class="sub">${esc(exOf(it.ex).name)} · ${esc(PATTERNS[slot.pattern] || "")}</p></div></header>
      <div class="card">${opts.map(optRow).join("") || `<div class="row"><span class="main"><span class="sub">Brak zamienników dla włączonego sprzętu.</span></span></div>`}</div></div>`;
  }
  if (sh.type === "warmup"){
    const starts = WARM_START.filter(w => eqOk(w.eq));
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Rozgrzewka"><span class="grab" aria-hidden="true"></span>
      <header><h2>Rozgrzewka</h2><p class="sub">Około 2 minut, jedno po drugim, bez przerw. Ma podnieść tętno i rozruszać stawy.</p></header>
      ${starts.length ? `<section class="sec"><h3 class="sec-h">Na start</h3><div class="choices" style="grid-template-columns:repeat(${starts.length},minmax(0,1fr))">${starts.map(w =>
        `<button class="choice ${S.profile.warmStart === w.id ? "on" : ""}" style="min-height:64px" data-act="warm-start" data-v="${w.id}" aria-pressed="${S.profile.warmStart === w.id}">${w.name}<small>${w.dose}</small></button>`).join("")}</div></section>` : ""}
      <section class="sec"><h3 class="sec-h">Potem</h3><div class="card">${WARMUP.map(w => `<div class="row"><span class="main"><span class="name" style="display:flex;justify-content:space-between;gap:12px"><span>${w.name}</span><span style="font-variant-numeric:tabular-nums">× ${w.reps}</span></span><span class="sub">${esc(w.cue)}</span></span></div>`).join("")}</div></section>
      <button class="btn" data-act="close">Gotowe</button></div>`;
  }
  if (sh.type === "menu"){
    const items = [["history", "Historia"], ["progress", "Progres"], ["settings", "Sprzęt i plan"]];
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Menu"><span class="grab" aria-hidden="true"></span>
      <div class="card">${items.map(([v, t]) => `<button class="row" style="min-height:56px" data-act="go" data-v="${v}"><span class="main"><span class="name" style="font-weight:400">${t}</span></span>${CHEV}</button>`).join("")}</div>
      <button class="btn outline" data-act="close">Zamknij</button></div>`;
  }
  if (sh.type === "confirm"){
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(sh.title)}"><span class="grab" aria-hidden="true"></span>
      <header><h2>${esc(sh.title)}</h2><p class="sub">${esc(sh.text)}</p></header>
      <div class="push" style="margin-top:0"><button class="btn" data-act="${sh.act}">${esc(sh.yes)}</button><button class="btn plain" data-act="close">${esc(sh.no)}</button></div></div>`;
  }
  return "";
}
function renderSheet(){
  const w = $("#sheet");
  if (!S.sheet){ w.hidden = true; w.innerHTML = ""; return; }
  w.innerHTML = sheetHtml(); w.hidden = false;
}

/* ---------- render ---------- */
function render(){
  const v = S.view;
  const html = !S.loaded || v === "home" ? renderHome() : v === "note" ? renderNote() : v === "history" ? renderHistory() : v === "progress" ? renderProgress()
    : v === "settings" ? renderSettings() : renderPrep();
  $("#app").innerHTML = html;
  renderSheet();
}
function go(view){ S.view = view; S.sheet = null; render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
function setItem(s, it, patch, variant = false){
  Object.assign(it, patch);
  const sl = slotByKey(it.key);
  if (sl && !it.swap){
    if (variant) sl.ex = it.ex;
    if (sl.ex === it.ex){ sl.load = it.load; sl.reps = it.reps; commitProfile(); }
  }
  commitSession(s);
}
function finishSession(){
  const s = current();
  clearTimeout(debouncers[s.id]);
  const t = $("#sessionNote"); if (t) s.note = t.value;
  s.status = "done"; s.finishedAt = Date.now();
  s.items.forEach(it => it.done = s.rounds);
  commitSession(s); S.micHint = false; go("home");
}

async function backup(btn){
  const data = JSON.stringify({app:"trening", v:2, exportedAt:new Date().toISOString(), profile:S.profile, sessions:S.sessions}, null, 1);
  const name = "trening-kopia-" + today() + ".json";
  try {
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Kopia zapasowa: trening"}); markBackup(); btn.textContent = "Kopia zapisana"; return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  markBackup(); btn.textContent = "Kopia zapisana";
}
function markBackup(){ S.profile.lastBackup = today(); commitProfile(); }
function backupAgeDays(){ if (!S.profile.lastBackup) return null; return Math.round((parseYmd(today()) - parseYmd(S.profile.lastBackup)) / 86400000); }
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== "trening" || !d.profile || typeof d.sessions !== "object") throw 0;
      S.profile = mergeProfile(d.profile); S.sessions = d.sessions; Store.replaceAll(S.profile, S.sessions);
      S.notice = "Kopia wczytana: " + Object.keys(d.sessions).length + " sesji.";
    } catch(e){ S.notice = "To nie jest kopia zapasowa z tej aplikacji."; }
    render();
  };
  r.readAsText(file);
}


/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b){ if (e.target.id === "sheet" && S.sheet && S.sheet.type !== "confirm"){ S.sheet = null; renderSheet(); } return; }
  if (!S.loaded) return;
  const act = b.dataset.act, s = current();
  const editIt = () => s.items.find(i => i.key === S.sheet?.key);
  switch (act){
    case "menu": S.sheet = {type:"menu"}; renderSheet(); break;
    case "go": go(b.dataset.v); break;
    case "home": go("home"); break;
    case "open": S.kind = b.dataset.kind; go("prep"); break;
    case "back-prep": go("prep"); break;
    case "note": go("note"); break;
    case "finish": finishSession(); break;
    case "seen": try { localStorage.setItem("trening:seen-review", b.dataset.id); } catch(e2){} render(); break;
    case "warmup": S.sheet = {type:"warmup"}; renderSheet(); break;
    case "warm-start": S.profile.warmStart = b.dataset.v; commitProfile(); renderSheet(); render(); break;
    case "edit": if (s.status !== "prep") return; S.sheet = {type:"edit", key:b.dataset.key || S.sheet?.key}; renderSheet(); break;
    case "set-variant": { const it = editIt(); if (!it) return; const ex = EX[b.dataset.ex]; if (!ex || ex.id === it.ex) return;
      setItem(s, it, {ex:ex.id, load:fitLoad(ex, loadsOf(ex).includes(it.load) ? it.load : ex.def[0]), reps:ex.def[1]}, true); renderSheet(); render(); break; }
    case "set-load": { const it = editIt(); if (!it) return; setItem(s, it, {load:b.dataset.l}); renderSheet(); render(); break; }
    case "reps": { const it = editIt(); if (!it) return; const r = it.reps + Number(b.dataset.d); if (r < 1) return; setItem(s, it, {reps:r}); renderSheet(); render(); break; }
    case "swap": S.sheet = {type:"swap", key:S.sheet.key}; renderSheet(); break;
    case "pick": {
      const it = editIt(); if (!it) return;
      const id = b.dataset.ex, ex = exOf(id), sl = slotByKey(it.key);
      if (sl && id === sl.ex) setItem(s, it, {ex:id, load:fitLoad(ex, sl.load), reps:sl.reps, swap:null});
      else { Object.assign(it, {ex:id, load:fitLoad(ex, ex.def[0]), reps:ex.def[1], swap:{from:it.swap ? it.swap.from : it.ex}}); commitSession(s); }
      S.sheet = {type:"edit", key:it.key}; renderSheet(); render(); break;
    }
    case "rounds": { const r = Math.max(1, Math.min(5, s.rounds + Number(b.dataset.d))); s.rounds = r; S.profile.rounds = r; commitProfile(); commitSession(s); render(); break; }
    case "mic": { S.micHint = true; render(); const t = $("#sessionNote"); if (t) t.focus(); break; }
    case "day": { const d = Number(b.dataset.d), sc = S.profile.schedule; S.profile.schedule = sc.includes(d) ? sc.filter(x => x !== d) : [...sc, d].sort(); commitProfile(); render(); break; }
    case "backup": backup(b); break;
    case "sync-on": {
      const url = ($("#syncUrl")?.value || "").trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){ Sync.err = "To nie wygląda na adres z Apps Script. Powinien zaczynać się od https://script.google.com/macros/s/ i kończyć na /exec."; render(); break; }
      S.busy = true; Sync.err = null; render();
      Sync.connect(url).then(ok => { S.busy = false; if (!ok){ Sync.disconnect(); Sync.err = "Nie udało się połączyć. Sprawdź, czy wdrożenie ma dostęp „Każdy”, i spróbuj jeszcze raz."; } render(); });
      break;
    }
    case "sync-now": Sync.pull().then(() => render()); break;
    case "sync-off": S.sheet = {type:"confirm", title:"Odłączyć arkusz?", text:"Dane w arkuszu zostaną. Nowe sesje będą zapisywać się tylko w telefonie.", act:"sync-off-yes", yes:"Odłącz", no:"Anuluj"}; renderSheet(); break;
    case "sync-off-yes": Sync.disconnect(); S.sheet = null; render(); break;
    case "reset": S.sheet = {type:"confirm", title:"Przywrócić plan startowy?", text:"Ćwiczenia, ciężary i powtórzenia wrócą do planu startowego. Historia zostaje.", act:"reset-yes", yes:"Przywróć", no:"Anuluj"}; renderSheet(); break;
    case "reset-yes": S.profile.slots = DEFAULT_SLOTS.map(x => ({...x})); S.profile.rounds = 3; commitProfile(); S.sheet = null; render(); break;
    case "close": S.sheet = null; renderSheet(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.note){ const s = current(); s.note = e.target.value; commitSession(s, true); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.eq){ S.profile.equip[t.dataset.eq] = t.checked; commitProfile(); render(); }
  if (t.id === "importFile" && t.files && t.files[0]) importBackup(t.files[0]);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet){ S.sheet = null; renderSheet(); } });

/* ---------- boot ---------- */
Store.init();
Sync.init();
{ const data = Store.load(); S.profile = mergeProfile(data.profile); S.sessions = data.sessions || {};
  try { S.reviews = JSON.parse(localStorage.getItem("trening:reviews") || "{}"); } catch(e){ S.reviews = {}; } }
S.loaded = true;
document.body.classList.remove("loading");
render();
Sync.pull().then(changed => { if (changed && ["home", "prep", "history", "progress"].includes(S.view)) render(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(() => {});
</script>
