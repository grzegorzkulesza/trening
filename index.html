<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trening">
<meta name="theme-color" content="#F5F4F0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Trening na dziś</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one full-height phone screen per step of the session; bottom sheets slide over Przygotowanie */
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --ink:#121212;
  --muted:#6B6B67;
  --faint:#9A9A95;
  --line:#EEEDE8;
  --chip:#F0EFEA;
  --good:#1F5B3D; --good-bg:#E3EFE7; --warn:#7A4A0E; --warn-bg:#F6EBDD;
  --font:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body,a,label,input,textarea{touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:20px;padding:calc(env(safe-area-inset-top) + 36px) 24px calc(env(safe-area-inset-bottom) + 32px)}
.loading .screen{opacity:.6;pointer-events:none}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.kicker{margin:0;font-size:15px;color:var(--muted)}
.title{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;font-size:16px;line-height:1.45;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{margin:0;font-size:15px;font-weight:500;color:var(--muted)}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.card{background:var(--surface);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:11px 18px;width:100%;border:0;background:transparent;text-align:left;color:inherit;min-height:64px}
.row + .row{border-top:1px solid var(--line)}
.row .num{width:16px;font-size:15px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.row .main{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.row .name{font-size:17px;font-weight:500}
.row .sub{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.row .why{font-size:14px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:4px;flex:none}
.tag{font-size:13px;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 10px;white-space:nowrap;flex:none}
.tag.up{color:var(--good);background:var(--good-bg)}
.tag.down{color:var(--warn);background:var(--warn-bg)}
.chev{flex:none}
.day-list{display:flex;flex-direction:column;gap:12px}
.day-card{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--surface);border-radius:20px;padding:20px 18px;text-align:left;color:inherit;min-height:96px}
.day-main{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.day-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.day-title{font-size:22px;font-weight:600;letter-spacing:-.01em}
.day-sub{font-size:15px;color:var(--muted)}
.status{font-size:13px;font-weight:500;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--muted);white-space:nowrap}
.status.done{background:var(--good-bg);color:var(--good)}
.status.live{background:var(--ink);color:#FFFFFF}
.day-card.off{opacity:.55}
.wk{display:flex;flex-direction:column;gap:6px;margin:0 -6px}
.wk-nav{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.wk-arrows{display:flex;gap:2px}
.wk-arrows button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--ink)}
.wk-arrows button:disabled{opacity:.3}
.wk-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk-c{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:2px 0;color:inherit;min-width:0}
.wk-c .l{font-size:13px;font-weight:500;color:var(--muted)}
.wk-c .n{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;padding-bottom:4px}
.wk-c.past .n{color:var(--muted)}
.wk-c.today .n{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-weight:600}
.wk-c.on .n{background:var(--ink);color:#FFFFFF;box-shadow:none}
.wk-c .dot{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%}
.wk-c .dot.plan{background:var(--faint)}
.wk-c .dot.done{background:#2F8A57}
.wk-c .dot.miss{box-shadow:inset 0 0 0 1.2px var(--faint)}
.wk-c.on .dot.plan{background:rgba(255,255,255,.7)}
.wk-c.on .dot.done{background:#7FD6A3}
.wk-c.on .dot.miss{box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.7)}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:15px;text-align:left;align-self:flex-start}

.btn{display:flex;align-items:center;justify-content:center;height:64px;border-radius:32px;border:0;background:var(--ink);color:#FFFFFF;font-size:18px;font-weight:600;width:100%;flex:none;text-decoration:none}
.btn.outline{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.plain{background:transparent;color:var(--ink);font-weight:500;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.push{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.home-head{align-items:center}
.head-btns{display:flex;gap:8px;flex:none}
.lvl-badge{padding:0;overflow:hidden}
.lvl-pill{height:44px;border:0;border-radius:22px;background:var(--surface);display:flex;align-items:center;gap:7px;padding:0 13px 0 6px;color:var(--ink);flex:none}
.lvl-pill b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.lvl-pill .tr{font-size:13px;font-weight:600;color:var(--good)}
.lvl-pill .tr.down{color:var(--warn)}
.grp-hero{gap:16px}
.grp-top{display:flex;align-items:center;gap:16px}
.grp-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.grp-name{margin:0;font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.grp-lv{margin:4px 0 0;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp-lv b{color:var(--ink);font-weight:600}
.grp-next{display:flex;flex-direction:column;gap:8px}
.gtrack{display:flex;align-items:center;gap:10px}
.gt-end{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.gt-end small,.gt-mid small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gt-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:16px}
.cat-next{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.grp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.grp-row b{color:var(--ink);font-weight:600}
.grp-to{display:inline-flex;align-items:center;gap:6px}
.grp-all{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px}
.grp-i{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px}
.grp-i small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-i.on small{color:var(--ink);font-weight:600}
.cat.cat-g{gap:12px;padding:16px 18px}
.cat-g .grp-top{gap:14px}
.cat-g .grp-lv{margin:0;font-size:14px}
.cat-b{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.step > .badge{margin-top:-1px}
.lvl-gauge{position:relative}
.lvl-gauge svg{position:absolute;inset:0}
.lvl-gauge b{position:relative;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.day-h{font-size:22px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:350px){.day-h{font-size:20px}}
.icon-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.round-btn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface);font-size:22px;line-height:1;flex:none}
.round-btn:disabled{opacity:.35}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .val{min-width:72px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

.choices{display:grid;gap:8px}
.choice{min-height:56px;border:0;border-radius:16px;background:var(--surface);font-size:16px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px}
.choice small{font-size:14px;color:var(--muted);font-weight:400}
.choice.on{background:var(--ink);color:#FFFFFF}
.choice.on small{color:#BDBCB7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--surface);font-size:15px;font-weight:500}
.pill.on{background:var(--ink);color:#FFFFFF}

.big-step{background:var(--surface);border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:space-between}
.big-step button{width:56px;height:56px;border:0;border-radius:28px;background:var(--chip);font-size:28px;line-height:1}
.big-step button:disabled{opacity:.35}
.big-step .v{display:flex;flex-direction:column;align-items:center;gap:2px}
.big-step .v b{font-size:44px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-step .v span{font-size:14px;color:var(--muted)}
.note{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}

/* session */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .mid{font-size:15px;font-weight:500}
.topbar .side{width:44px;text-align:right;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:#E2E0DA}
.segs i.done{background:var(--ink)}
.segs i.cur{background:#A8A7A2}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.center h1{margin:0;font-size:34px;line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.bignum{display:flex;flex-direction:column;align-items:center;gap:4px}
.bignum b{font-size:128px;line-height:1;font-weight:600;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.bignum span{font-size:17px;color:var(--muted)}
.loadpill{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:10px 18px;font-size:20px;font-weight:500}
.loadpill .dot{width:12px;height:12px;border-radius:6px}
.cue{margin:0;max-width:290px;font-size:16px;line-height:1.5;color:var(--muted)}
.next{margin:0;text-align:center;font-size:15px;color:var(--muted)}
.timer{font-size:96px;line-height:1;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bar{width:200px;height:4px;border-radius:2px;background:#E2E0DA;overflow:hidden}
.bar i{display:block;height:4px;background:var(--ink);border-radius:2px}
.upnext{background:var(--surface);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.upnext .k{font-size:14px;color:var(--muted)}
.upnext .n{font-size:20px;font-weight:600;letter-spacing:-.01em}

.field{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field textarea{width:100%;border:0;outline:none;resize:none;background:transparent;font-size:16px;line-height:1.45;padding:4px 4px;min-height:72px;text-align:center}
.field textarea::placeholder{color:#8A8984}
.note-field{flex:1;min-height:340px;padding:18px}
.note-field textarea{flex:1;text-align:left;font-size:17px;line-height:1.5;padding:0}
.mic{width:100%;height:54px;flex:none;border:0;border-radius:22px;background:var(--chip);display:grid;place-items:center}
.hint{margin:6px 0 0;font-size:13px;color:var(--muted)}
.wait{display:flex;align-items:center;gap:12px}
.wait i{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.input{width:100%;border:0;border-radius:14px;background:var(--surface);padding:14px 16px;font-size:16px}

.verdict{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.verdict .t{margin:0;font-size:22px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.verdict p{margin:0;font-size:16px;line-height:1.5;color:#3F3F3C}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{font-size:14px;line-height:1.4;padding:12px 14px;border-radius:14px;background:var(--surface);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.lvl{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.lvl-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lvl-num{margin:0;display:flex;align-items:baseline;gap:6px;flex:none;white-space:nowrap}
.lvl-num b{font-size:64px;line-height:1;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lvl-num span{font-size:20px;color:var(--muted)}
.chip-d{font-size:13px;border-radius:999px;padding:6px 12px;white-space:nowrap;flex:none;color:var(--good);background:var(--good-bg)}
.chip-d.down{color:var(--warn);background:var(--warn-bg)}
.lvl svg{width:100%;height:auto;display:block}
.bar{height:6px;width:100%;flex:none;align-self:stretch;border-radius:3px;background:#ECEBE6;display:flex;overflow:hidden}
.bar i{display:block;border-radius:3px;background:var(--ink)}
.cat{display:flex;flex-direction:column;gap:8px;padding:14px 18px;width:100%;border:0;background:transparent;text-align:left;color:inherit}
.cat + .cat{border-top:1px solid var(--line)}
.cat-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cat-top .n{font-size:17px;font-weight:500}
.cat-top .v{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.cat-top .v b{font-size:20px;font-weight:600}
.cat-top .d{font-size:13px;color:var(--good)}
.cat-top .d.down{color:var(--warn)}
.cat .s{font-size:14px;color:var(--muted)}
.cat.locked .n{color:var(--muted)}
.step{display:flex;align-items:flex-start;gap:14px;padding:14px 18px}
.step + .step{border-top:1px solid var(--line)}
.step.cur{background:#FAFAF7}
.step .mk{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;flex:none}
.step .mk.done,.step .mk.cur{background:var(--ink)}
.step .mk.next i{width:12px;height:12px;border-radius:6px;border:2px solid #C9C8C2}
.step .bd{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.step .bd b{font-size:16px;font-weight:500}
.step .bd span{font-size:14px;line-height:1.45;color:var(--muted)}
.modbar{height:14px;border-radius:7px;overflow:hidden;display:flex;gap:2px;background:#ECEBE6}
.legend{display:flex;flex-direction:column;gap:8px}
.legend span{display:flex;align-items:center;gap:10px;font-size:15px}
.legend i,.pdot{width:10px;height:10px;border-radius:5px;flex:none;display:inline-block}
.legend em{flex:1;font-style:normal}
.legend b{font-weight:600}
.pat{display:flex;align-items:center;gap:12px;padding:12px 18px}
.pat + .pat{border-top:1px solid var(--line)}
.pat .bd{display:flex;flex-direction:column;gap:2px}
.pat .bd b{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
.pat.off .bd b{color:var(--muted)}
.pat .bd span{font-size:13px;color:var(--muted)}
.hist span{font-size:13px;background:var(--chip);border-radius:8px;padding:3px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
.analysis{font-size:15px;line-height:1.5}
.analysis h4{margin:14px 0 4px;font-size:16px;font-weight:600}
.analysis p{margin:0 0 6px}
.analysis ul{margin:0 0 6px;padding-left:20px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;min-height:56px}
.opt + .opt{border-top:1px solid var(--line)}
.opt label{flex:1;font-size:16px}
.opt small{display:block;color:var(--muted);font-size:13px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#D6D4CE;position:relative;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;transition:transform .15s}
.sw:checked{background:var(--ink)}
.sw:checked::after{transform:translateX(20px)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days .choice{min-height:48px;font-size:14px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(18,18,18,.42)}
.sheet-wrap[hidden]{display:none}
.sheet{position:relative;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 24px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:24px;max-height:92%;overflow-y:auto;width:100%;max-width:480px;margin:0 auto}
.sheet-x{position:absolute;top:16px;right:16px;z-index:1}
.sheet>header,.sheet>.head{padding-right:52px}
.sheet h2{margin:0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.02em}
.sheet header .sub{margin:6px 0 0;font-size:15px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="loading">
<div id="app"></div>
<div id="sheet" class="sheet-wrap" hidden></div>

<script>
"use strict";
const APP_VERSION = "2026-11-11.33";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DAYS = ["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];
const DAYS_SHORT = ["ndz","pon","wt","śr","czw","pt","sob"];
const MONTHS = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia","września","października","listopada","grudnia"];
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const plKg = n => String(n).replace(".", ",");
function platesText(kg){

}

  "Sztanga (gryf 20 kg, bumpery, stojaki; kody ciężaru bb + kg, np. bb62.5, od bb20 do bb127.5 co 2,5 kg): w każdym Strength jedno ćwiczenie ze sztangą, po kolei Deadlift (key bb-dl), Front Squat (bb-fs), Push Press (bb-pp); w tej sesji zastępuje odpowiednio KB Swing, Bulgarian Split Squat albo KB Clean & Press. " +
  "Na sztangę zawsze 5 reps na rundę. Za łatwo: Deadlift +5 kg, Front Squat i Push Press +2,5 kg. Trudno, sypiąca się technika, okrągłe plecy albo ból: ten sam ciężar albo −5 kg. Nie dokładaj szybciej, niż wynika z notatki; technika ważniejsza niż kilogramy. " +
  "Zmieniaj tylko key z dzisiejszej sesji. Nie dodawaj nowych ćwiczeń, nie zmieniaj Mobility, bez głośnych ćwiczeń. Konkretne liczby, bez zakresów. Nazwy ćwiczeń, wzorców i rodzajów sesji zawsze po angielsku (np. Strength, Conditioning, Mobility, rounds, reps, Push-up zamiast pompki), reszta tekstu po polsku, bez moralizowania i motywowania.\n";
const Coach = {
  group: s => s.kind === "cond" ? "cond" : "circuit",
  allowed(group){
    const out = {};
    slotsOf(group).forEach(sl => {
      const ids = ladderOf(sl).filter(id => EX[id] && (id === sl.ex || exAvailable(EX[id])));
      if (!ids.includes(sl.ex) && EX[sl.ex]) ids.unshift(sl.ex);
      out[sl.key] = Object.fromEntries(ids.map(id => [id, loadsOf(EX[id])]));
    });
    return out;
  },
  // Barbell load lists are long: one line instead of 44 codes.
  allowedText(group){ return JSON.stringify(this.allowed(group), (k, v) => Array.isArray(v) && v.length > 8 && v.every(x => LOADS[x] && LOADS[x].bb) ? v[0] + " … " + v[v.length - 1] + " (co 2,5 kg)" : v); },
  brief: x => ({data:x.date, rundy:x.rounds, notatka:x.note || "", cwiczenia:(x.items || []).map(it => ({key:it.key, ex:it.ex, nazwa:exOf(it.ex).name, dawka:doseText(it.ex, it.load, it.reps), zamianaNaDzis:it.swap ? true : undefined}))}),
  prompt(s, earlier){
    const g = this.group(s);
    const plan = slotsOf(g).filter(sl => !sl.bb || bbOn()).map(sl => ({key:sl.key, pattern:sl.pattern, ex:sl.ex, load:sl.load, reps:sl.reps, teraz:exOf(sl.ex).name + " " + doseText(sl.ex, sl.load, sl.reps), sztangaZamiast:sl.bb}));
    const prev = Object.values(S.sessions).filter(x => x.v === 2 && x.kind === s.kind && x.status === "done" && x.id !== s.id && x.date <= s.date).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
    const revs = Object.values(S.reviews || {}).filter(r => r.id !== s.id).sort((a, b) => String(a.date + a.id).localeCompare(String(b.date + b.id))).slice(-4);
    return (s.kind === "cond" ? COND_RULES : "") + BASE_RULES +
      "Dozwolone id i kody ciężaru dla każdego key: " + this.allowedText(g) + "\n" +
      "Plan teraz" + (g === "circuit" ? " (rundy: " + S.profile.rounds + ")" : "") + ": " + JSON.stringify(plan) + "\n" +
      "Dzisiaj: " + JSON.stringify(this.brief(s)) + "\n" +
      "Poprzednie treningi (najnowsze najpierw): " + JSON.stringify(prev.map(x => this.brief(x))) + "\n" +
      "Poprzednie oceny: " + JSON.stringify(revs) + "\n" +
      (earlier ? "Ten trening był już oceniony przed poprawką notatki: " + JSON.stringify(earlier) + ". Jego zmiany są już w planie teraz. Nie powtarzaj ich; zmień tylko to, co poprawiona notatka mówi inaczej (możesz cofnąć wcześniejszą zmianę).\n" : "") +
      'Zwróć wyłącznie JSON: {"title":"krótki werdykt","text":"2–4 zdania: co z notatki wynika dla każdego ważnego ćwiczenia","rounds":liczba rund na następny trening,"changes":[{"key":"klucz z planu","ex":"id","load":"kod","reps":liczba,"reason":"jedno zdanie"}]}. W changes tylko ćwiczenia, które zmieniasz. Jeśli notatka podaje czas testu Row 2000 m na maksa, dodaj pole "row2000":"m:ss".';
  },
  parse(text){ const m = String(text || "").match(/\{[\s\S]*\}/); if (!m) return null; try { return JSON.parse(m[0]); } catch(e){ return null; } },
  apply(s, out){
    const g = this.group(s), allowed = this.allowed(g), now = Date.now(), changes = [];
    (Array.isArray(out.changes) ? out.changes : []).forEach(c => {
      const sl = slotsOf(g).find(x => x.key === c.key); if (!sl || !(s.items || []).some(it => it.key === c.key)) return;
      const loads = (allowed[sl.key] || {})[c.ex]; if (!loads) return;
      const load = loads.includes(c.load) ? c.load : (loads.includes(sl.load) ? sl.load : loads[0]);
      const ex = EX[c.ex], max = ex.minutes ? 45 : ex.interval ? 16 : 60;
      const reps = Math.max(1, Math.min(max, parseInt(c.reps, 10) || sl.reps));
      if (c.ex === sl.ex && load === sl.load && reps === sl.reps) return;
      changes.push(exOf(sl.ex).name + ": " + doseText(sl.ex, sl.load, sl.reps) + " → " + (c.ex !== sl.ex ? exOf(c.ex).name + " " : "") + doseText(c.ex, load, reps));
      Object.assign(sl, {ex:c.ex, load, reps, claudeNote:String(c.reason || "").slice(0, 200), claudeAt:now});
    });
    const r = parseInt(out.rounds, 10);
    if (g === "circuit" && r >= 1 && r <= 5 && r !== S.profile.rounds){ changes.push("Rounds: " + S.profile.rounds + " → " + r); S.profile.rounds = r; }
    if (changes.length) commitProfile();
    const m = String(out.row2000 || "").match(/^(\d{1,2}):(\d{2})(?:[.,]\d)?$/);
    if (m){ const sec = +m[1] * 60 + +m[2]; if (sec >= 300 && sec <= 900){ s.bench = {...(s.bench || {}), row2000:sec}; commitSession(s); } }
    return {id:s.id, date:s.date, title:String(out.title || "Sesja zapisana.").slice(0, 120), text:String(out.text || "").slice(0, 1500), changes:changes.join("; ") || "bez zmian"};
  }
};

const Sync = {
  url:null, q:new Set(), timer:null, busy:false, last:null, err:null,
  init(){
    try { this.url = localStorage.getItem(KEY_URL) || null; (JSON.parse(localStorage.getItem(KEY_Q) || "[]")).forEach(x => this.q.add(x)); } catch(e){}
    window.addEventListener("online", () => this.flush());
    document.addEventListener("visibilitychange", () => { if (!document.hidden){ this.flush(); this.retryReview(); } });
  },
  saveQ(){ try { localStorage.setItem(KEY_Q, JSON.stringify([...this.q])); } catch(e){} },
  queue(id){ if (!this.url) return; this.q.add(id); this.saveQ(); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); },
  row(x){
    return {session:x, items:(x.items || []).map(it => exOf(it.ex).name + " " + doseText(it.ex, it.load, it.reps) + (it.swap ? " [zamiast " + exOf(it.swap.from).name + "]" : "")).join("; ")};
  },
  async flush(){
    if (!this.url || this.busy || !this.q.size || !navigator.onLine) return;
    this.busy = true;
    const ids = [...this.q];
    const body = {sessions: ids.filter(id => id !== "profile" && S.sessions[id] && S.sessions[id].touched).map(id => this.row(S.sessions[id])),
      reviews: ids.filter(id => id.startsWith("rv:")).map(id => S.reviews[id.slice(3)]).filter(Boolean)};
    if (ids.includes("profile")){ body.profile = S.profile; body.planText = this.planText(); }
    try {
      const res = await fetch(this.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)});
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "błąd arkusza");
      ids.forEach(id => this.q.delete(id)); this.saveQ(); this.last = Date.now(); this.err = null;
    } catch(e){ this.err = "Nie udało się wysłać do arkusza. Spróbuję ponownie."; }
    this.busy = false;
    if (S.view === "settings") render();
    if (this.q.size && !this.err) this.flush();
  },
  async pull(){
    if (!this.url || !navigator.onLine) return false;
    try {
      const res = await fetch(this.url, {method:"GET"});
      const j = await res.json();
      if (!j.ok) throw new Error("bad");
      let changed = false;
      for (const [id, r] of Object.entries(j.sessions || {})){
        const l = S.sessions[id];
        if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ S.sessions[id] = r; changed = true; }
      }
      for (const [id, l] of Object.entries(S.sessions)){
        const r = (j.sessions || {})[id];
        if (l.v === 2 && l.touched && (!r || (l.updatedAt || 0) > (r.updatedAt || 0))) this.q.add(id);
      }
      if (Array.isArray(j.reviews)){
        const rv = {}; j.reviews.forEach(r => { if (r && r.id) rv[r.id] = r; });
        for (const k of this.q) if (k.startsWith("rv:") && S.reviews[k.slice(3)]) rv[k.slice(3)] = S.reviews[k.slice(3)];
        if (JSON.stringify(rv) !== JSON.stringify(S.reviews)){ S.reviews = rv; changed = true; try { localStorage.setItem("trening:reviews", JSON.stringify(rv)); } catch(e){} }
      }
      if (j.profile && (j.profile.updatedAt || 0) > (S.profile.updatedAt || 0)){ S.profile = mergeProfile(j.profile); changed = true; this.q.add("profile"); }
      else if (!j.profile || (S.profile.updatedAt || 0) > (j.profile.updatedAt || 0)) this.q.add("profile");
      this.saveQ();
      if (changed) Store.replaceAll(S.profile, S.sessions);
      this.last = Date.now(); this.err = null;
      this.flush();
      this.retryReview();
      return changed;
    } catch(e){ this.err = "Nie mogę połączyć się z arkuszem. Sprawdź adres i internet."; return false; }
  },
  async connect(url){
    this.url = url; try { localStorage.setItem(KEY_URL, url); } catch(e){}
    const before = this.err; await this.pull();
    if (!this.err){ Object.keys(S.sessions).forEach(id => { if (S.sessions[id].touched) this.q.add(id); }); this.q.add("profile"); this.saveQ(); this.flush(); }
    return !this.err;
  },
  pendingReview(){ try { return JSON.parse(localStorage.getItem(KEY_PR) || "null"); } catch(e){ return null; } },
  setPendingReview(p){ try { p ? localStorage.setItem(KEY_PR, JSON.stringify(p)) : localStorage.removeItem(KEY_PR); } catch(e){} },
  retryReview(){
    const p = this.pendingReview();
    if (!p || !this.url || S.reviewing) return;
    const r = S.reviews[p.id], s = S.sessions[p.id];
    if (!s || s.status !== "done" || (r && (r.title + r.text) !== p.prev)){ this.setPendingReview(null); return; }
    this.review(p.id, p.force);
  },
  async review(id, force){
    const s = S.sessions[id];
    if (!this.url || !s || S.reviewing) return;
    const redraw = () => { if (["home", "prep"].includes(S.view)) render(); };
    if (!navigator.onLine){ S.reviewErr = "Brak internetu. Ocena przyjdzie, gdy telefon złapie sieć."; redraw(); return; }
    S.reviewing = id; S.reviewErr = null; redraw();
    for (let i = 0; i < 60 && this.busy; i++) await sleep(250);
    this.busy = true; clearTimeout(this.timer);
    const body = {sessions:[this.row(s)], review:id, force:!!force, claude:{prompt:Coach.prompt(s, force ? reviewFor(id) : null), effort:"medium", model:COACH_MODEL}};
    let got = false, relay = false;
    if (this.q.has("profile")){ body.profile = S.profile; body.planText = this.planText(); }
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 150000);
    try {
      const res = await fetch(this.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body), signal:ctrl.signal});
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || "błąd arkusza");
      this.q.delete(id); if (body.profile) this.q.delete("profile");
      if (j.claude){
        relay = true;
        const out = j.claude.error ? null : Coach.parse(j.claude.text);
        if (out){
          const rv = Coach.apply(s, out); got = true; S.reviews[rv.id] = rv; this.q.add("rv:" + rv.id); this.setPendingReview(null);
          try { localStorage.setItem("trening:reviews", JSON.stringify(S.reviews)); if (S.view === "prep") localStorage.setItem("trening:seen-review", rv.id); } catch(e){}
        } else S.reviewErr = j.claude.error || "Nieczytelna odpowiedź Claude (" + (j.claude.stop || "?") + ").";
        this.saveQ();
      } else {
      if (j.profile){ S.profile = mergeProfile(j.profile); Store.saveProfile(); this.q.add("profile"); }
      this.saveQ();
      if (j.review){
        got = true; S.reviews[j.review.id] = j.review; this.setPendingReview(null);
        try { localStorage.setItem("trening:reviews", JSON.stringify(S.reviews)); if (S.view === "prep") localStorage.setItem("trening:seen-review", j.review.id); } catch(e){}
      } else S.reviewErr = j.reviewError || "Claude nie odpowiedział.";
      }
      this.last = Date.now(); this.err = null;
    } catch(e){
      S.reviewErr = e.name === "AbortError" ? "Ocena trwa dłużej niż zwykle. Sprawdzę ją przy następnym otwarciu aplikacji." : "Nie udało się połączyć z arkuszem. Spróbuję ponownie przy następnym otwarciu aplikacji.";
    }
    clearTimeout(timer); this.busy = false; S.reviewing = null; redraw();
    if (got && !relay) { await this.pull(); redraw(); }
    else if (this.q.size) await this.flush();
  },
  planText(){ return S.profile.slots.filter(sl => !sl.bb || bbOn()).map(sl => [(sl.group === "circuit" ? (sl.bb ? "Circuit, sztanga zamiast " + exOf((slotByKey(sl.bb) || {}).ex).name + ": " : "Circuit: ") : sl.group === "cond" ? "Conditioning: " : "Mobility: ") + exOf(sl.ex).name, doseText(sl.ex, sl.load, sl.reps)]); },
  disconnect(){ this.url = null; this.q.clear(); this.err = null; try { localStorage.removeItem(KEY_URL); localStorage.removeItem(KEY_Q); } catch(e){} }
};

const CLAUDE_TAG_DAYS = 7;

  const byClaude = sl && sl.claudeAt && Date.now() - sl.claudeAt < CLAUDE_TAG_DAYS * 86400000 && sl.ex === it.ex && sl.load === it.load && sl.reps === it.reps;
  const tag = it.swap ? `<span class="tag">zamiana na dziś</span>` : changed ? `<span class="tag">zmienione</span>` : byClaude ? `<span class="tag up">od Claude</span>` : "";
  const inner = `${i != null ? `<span class="num">${i+1}</span>` : ""}<span class="main"><span class="name">${esc(ex.name)}</span><span class="sub">${dotHtml(it.load)}${esc(doseText(it.ex, it.load, it.reps) + (LOADS[it.load] && LOADS[it.load].bb ? " · " + platesText(LOADS[it.load].bb) : ""))}</span></span>${tag}${tappable ? CHEV : ""}`;

    const cols = Math.min(3, loads.length);
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Zmiana ćwiczenia">${SHEET_X}
      <header><h2>${esc(ex.name)}</h2><p class="sub">${s.kind === "strength" ? "Circuit, " + (idx+1) + "/" + s.items.length : kindLabel(s.kind)} · w planie ${esc(exOf(it.planEx).name + " " + doseText(it.planEx, it.planLoad, it.planReps))}</p>
        ${slot && slot.claudeNote && !it.swap ? `<p class="sub">Od Claude: ${esc(slot.claudeNote)}</p>` : ""}</header>
      ${variants.length > 1 ? `<section class="sec"><h3 class="sec-h">Variant</h3><div class="chips">${variants.map(id => { const v = EX[id];
        return `<button class="pill ${it.ex === id ? "on" : ""}" data-act="set-variant" data-ex="${id}" aria-pressed="${it.ex === id}">${esc(v.name + (v.tag ? " (" + v.tag + ")" : ""))}</button>`; }).join("")}</div></section>` : ""}
      ${ex.bb ? (() => { const kg = LOADS[it.load] ? LOADS[it.load].bb : BAR, i = BB_LOADS.indexOf(it.load);
        return `<section class="sec"><h3 class="sec-h">Load</h3><div class="big-step"><button data-act="bbload" data-d="-1" aria-label="Lżej o 2,5 kg" ${i <= 0 ? "disabled" : ""}>−</button><span class="v"><b>${plKg(kg)} kg</b><span>${esc(platesText(kg))}</span></span><button data-act="bbload" data-d="1" aria-label="Ciężej o 2,5 kg" ${i >= BB_LOADS.length - 1 ? "disabled" : ""}>+</button></div></section>`; })()
      : loads.length > 1 ? `<section class="sec"><h3 class="sec-h">Load</h3><div class="choices" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${loads.map(l =>
        `<button class="choice ${it.load === l ? "on" : ""}" style="flex-direction:row;gap:8px" data-act="set-load" data-l="${l}" aria-pressed="${it.load === l}">${dotHtml(l)}${esc(LOADS[l].label)}</button>`).join("")}</div></section>` : ""}
      <section class="sec"><h3 class="sec-h">${ex.timed ? "Time" : ex.dist ? "Distance" : ex.minutes ? "Time" : ex.interval ? "Rounds" : "Reps"}${s.kind === "strength" ? " per round" : ""}${ex.side ? " (per side)" : ""}</h3>
        <div class="big-step"><button data-act="reps" data-d="-${step}" aria-label="Mniej" ${it.reps - step < 1 ? "disabled" : ""}>−</button><span class="v"><b>${it.reps}${ex.timed ? " s" : ex.dist ? " m" : ex.minutes ? " min" : ""}</b><span>${esc(diff)}</span></span><button data-act="reps" data-d="${step}" aria-label="Więcej">+</button></div></section>
      <p class="note">${it.swap ? "To zamiana tylko na dziś. Plan się nie zmienia." : "Zmiana zostaje w planie na następne treningi."}</p>
      <div class="card"><button class="row" data-act="swap" style="min-height:56px"><span class="main"><span class="name" style="font-weight:400">${it.swap ? "Wróć do planu albo zamień na inne" : "Zamień na inne ćwiczenie (tylko dziś)"}</span></span>${CHEV}</button></div>
      <button class="btn" data-act="close">Gotowe</button></div>`;
  }
  if (sh.type === "swap"){
    const it = s.items.find(i => i.key === sh.key), slot = slotByKey(sh.key);
    const lad = ladderOf(slot), slotBb = !!exOf(slot.ex).bb;
    const order = {"łatwiej":1, "podobnie":2, "trudniej":3};
    const opts = Object.values(EX).filter(e => e.pattern === slot.pattern && e.id !== it.ex && exAvailable(e) && (e.id === slot.ex || !lad.includes(e.id)))
      .sort((a, b) => (a.id === slot.ex ? -1 : a.alt ? order[a.rel] || 4 : 0) - (b.id === slot.ex ? -1 : b.alt ? order[b.rel] || 4 : 0));
    const optRow = e => { const load = e.id === slot.ex ? fitLoad(e, slot.load) : fitLoad(e, e.def[0]), reps = e.id === slot.ex ? slot.reps : e.def[1];
      return `<button class="row" data-act="pick" data-ex="${esc(e.id)}"><span class="main"><span class="name">${esc(e.name)}</span><span class="sub">${dotHtml(load)}${esc(doseText(e.id, load, reps))}</span>${e.why ? `<span class="why">${esc(e.why)}</span>` : ""}</span><span class="tag">${e.id === slot.ex ? "z planu" : e.alt ? esc(e.rel || "zamiennik") : !!e.bb !== slotBb ? (e.bb ? "sztanga" : "bez sztangi") : "wariant"}</span></button>`; };
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Zamiana ćwiczenia">${SHEET_X}
      <header class="head"><div><h2>Zamień</h2><p class="sub">${esc(exOf(it.ex).name)} · ${esc(PATTERNS[slot.pattern] || "")}</p></div></header>
      <div class="card">${opts.map(optRow).join("") || `<div class="row"><span class="main"><span class="sub">Brak zamienników dla włączonego sprzętu.</span></span></div>`}</div></div>`;
  }
  if (sh.type === "warmup"){
    const starts = WARM_START.filter(w => eqOk(w.eq));
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Warm-up">${SHEET_X}
      <header><h2>Warm-up</h2><p class="sub">Około 2 minut, jedno po drugim, bez przerw. Ma podnieść tętno i rozruszać stawy.</p></header>
      ${starts.length ? `<section class="sec"><h3 class="sec-h">Start</h3><div class="choices" style="grid-template-columns:repeat(${starts.length},minmax(0,1fr))">${starts.map(w =>
        `<button class="choice ${S.profile.warmStart === w.id ? "on" : ""}" style="min-height:64px" data-act="warm-start" data-v="${w.id}" aria-pressed="${S.profile.warmStart === w.id}">${w.name}<small>${w.dose}</small></button>`).join("")}</div></section>` : ""}
      <section class="sec"><h3 class="sec-h">Then</h3><div class="card">${WARMUP.map(w => `<div class="row"><span class="main"><span class="name" style="display:flex;justify-content:space-between;gap:12px"><span>${w.name}</span><span style="font-variant-numeric:tabular-nums">× ${w.reps}</span></span><span class="sub">${esc(w.cue)}</span></span></div>`).join("")}</div></section>
      <button class="btn" data-act="close">Gotowe</button></div>`;
  }
  if (sh.type === "confirm"){
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(sh.title)}">${SHEET_X}
      <header><h2>${esc(sh.title)}</h2><p class="sub">${esc(sh.text)}</p></header>
      <div class="push" style="margin-top:0"><button class="btn" data-act="${sh.act}">${esc(sh.yes)}</button><button class="btn plain" data-act="close">${esc(sh.no)}</button></div></div>`;
  }
  return "";
}
const SHEET_X = `<button class="icon-btn sheet-x" data-act="close" aria-label="Zamknij"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
function renderSheet(){
  const w = $("#sheet");
  if (!S.sheet){ w.hidden = true; w.innerHTML = ""; return; }
  w.innerHTML = sheetHtml(); w.hidden = false;
}

/* ---------- render ---------- */
function render(){
  const v = S.view;
  const html = !S.loaded || v === "home" ? renderHome() : v === "note" ? renderNote() : v === "detail" ? (S.sessions[S.detail?.id] ? doneScreen(S.sessions[S.detail.id]) : renderHome()) : v === "plan" ? planScreen(S.detail.date, S.detail.kind) : v === "progress" ? renderProgress() : v === "cat" ? renderCat() : v === "coverage" ? renderCoverage()
    : v === "settings" ? renderSettings() : renderPrep();
  $("#app").innerHTML = html;
  fitDayTitle();
  renderSheet();
}
function fitDayTitle(){
  const h = $(".day-h"); if (!h) return;
  let fits; try { fits = JSON.parse(h.dataset.fits); } catch(e){ return; }
  for (const t of fits){ h.textContent = t; if (h.scrollWidth <= h.clientWidth + 1) return; }
}
window.addEventListener("resize", fitDayTitle);
function go(view){ S.view = view; S.sheet = null; render(); window.scrollTo(0, 0); }

/* ---------- actions ---------- */
function setItem(s, it, patch, variant = false){
  Object.assign(it, patch);
  const sl = slotByKey(it.key);
  if (sl && !it.swap){
    if (variant) sl.ex = it.ex;
    if (sl.ex === it.ex){ sl.load = it.load; sl.reps = it.reps; commitProfile(); }
  }
  commitSession(s);
}
function finishSession(){
  const s = current();
  clearTimeout(debouncers[s.id]);
  const t = $("#sessionNote"); if (t) s.note = t.value;
  s.status = "done"; s.finishedAt = Date.now();
  s.items.forEach(it => it.done = s.rounds);
  S.micHint = false;
  const had = reviewFor(s.id);
  if (s.kind !== "mobility" && Sync.url && (!had || (s.note || "") !== (s.reviewedNote || ""))){
    s.reviewedNote = s.note || "";
    commitSession(s);
    Sync.setPendingReview({id:s.id, force:!!had, prev:had ? had.title + had.text : ""});
    go("prep"); Sync.review(s.id, !!had);
  } else { commitSession(s); go(s.kind !== "mobility" && Sync.url ? "prep" : "home"); }
}

async function backup(btn){
  const data = JSON.stringify({app:"trening", v:2, exportedAt:new Date().toISOString(), profile:S.profile, sessions:S.sessions}, null, 1);
  const name = "trening-kopia-" + today() + ".json";
  try {
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Kopia zapasowa: trening"}); markBackup(); btn.textContent = "Kopia zapisana"; return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type:"application/json"})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  markBackup(); btn.textContent = "Kopia zapisana";
}
function markBackup(){ S.profile.lastBackup = today(); commitProfile(); }
function backupAgeDays(){ if (!S.profile.lastBackup) return null; return Math.round((parseYmd(today()) - parseYmd(S.profile.lastBackup)) / 86400000); }
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== "trening" || !d.profile || typeof d.sessions !== "object") throw 0;
      S.profile = mergeProfile(d.profile); S.sessions = d.sessions; Store.replaceAll(S.profile, S.sessions);
      S.notice = "Kopia wczytana: " + Object.keys(d.sessions).length + " sesji.";
    } catch(e){ S.notice = "To nie jest kopia zapasowa z tej aplikacji."; }
    render();
  };
  r.readAsText(file);
}


/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b){ if (e.target.id === "sheet" && S.sheet && S.sheet.type !== "confirm"){ S.sheet = null; renderSheet(); } return; }
  if (!S.loaded) return;
  const act = b.dataset.act, s = current();
  const editIt = () => s.items.find(i => i.key === S.sheet?.key);
  switch (act){
    case "go": go(b.dataset.v); break;
    case "cat": S.cat = b.dataset.c; go("cat"); break;
    case "home": go("home"); break;
    case "open": S.kind = b.dataset.kind; go("prep"); break;
    case "detail": S.detail = {id:b.dataset.id}; go("detail"); break;
    case "plan-detail": S.detail = {date:b.dataset.date, kind:b.dataset.kind}; go("plan"); break;
    case "pick-day": S.sel = b.dataset.date === today() ? null : b.dataset.date; render(); break;
    case "wk": { const off = Math.max(wkMin(), Math.min(WK_MAX, (S.weekOff || 0) + Number(b.dataset.d))); if (off === (S.weekOff || 0)) break; S.weekOff = off;
      const w = parseYmd(selDate()).getDay(), m = mondayOf(today(), off); m.setDate(m.getDate() + (w + 6) % 7); const nd = off === 0 ? today() : ymd(m); S.sel = nd === today() ? null : nd; render(); break; }
    case "back-prep": go("prep"); break;
    case "note": go("note"); break;
    case "finish": finishSession(); break;
    case "review": Sync.retryReview(); break;
    case "seen": try { localStorage.setItem("trening:seen-review", b.dataset.id); } catch(e2){} render(); break;
    case "warmup": S.sheet = {type:"warmup"}; renderSheet(); break;
    case "warm-start": S.profile.warmStart = b.dataset.v; commitProfile(); renderSheet(); render(); break;
    case "edit": if (s.status !== "prep") return; S.sheet = {type:"edit", key:b.dataset.key || S.sheet?.key}; renderSheet(); break;
    case "set-variant": { const it = editIt(); if (!it) return; const ex = EX[b.dataset.ex]; if (!ex || ex.id === it.ex) return;
      setItem(s, it, {ex:ex.id, load:fitLoad(ex, loadsOf(ex).includes(it.load) ? it.load : ex.def[0]), reps:ex.def[1]}, true); renderSheet(); render(); break; }
    case "bbload": { const it = editIt(); if (!it) return; const i = BB_LOADS.indexOf(it.load) + Number(b.dataset.d); if (i < 0 || i >= BB_LOADS.length) return; setItem(s, it, {load:BB_LOADS[i]}); renderSheet(); render(); break; }
    case "set-load": { const it = editIt(); if (!it) return; setItem(s, it, {load:b.dataset.l}); renderSheet(); render(); break; }
    case "reps": { const it = editIt(); if (!it) return; const r = it.reps + Number(b.dataset.d); if (r < 1) return; setItem(s, it, {reps:r}); renderSheet(); render(); break; }
    case "swap": S.sheet = {type:"swap", key:S.sheet.key}; renderSheet(); break;
    case "pick": {
      const it = editIt(); if (!it) return;
      const id = b.dataset.ex, ex = exOf(id), sl = slotByKey(it.key);
      if (sl && id === sl.ex) setItem(s, it, {ex:id, load:fitLoad(ex, sl.load), reps:sl.reps, swap:null});
      else { Object.assign(it, {ex:id, load:fitLoad(ex, ex.def[0]), reps:ex.def[1], swap:{from:it.swap ? it.swap.from : it.ex}}); commitSession(s); }
      S.sheet = {type:"edit", key:it.key}; renderSheet(); render(); break;
    }
    case "rounds": { const r = Math.max(1, Math.min(5, s.rounds + Number(b.dataset.d))); s.rounds = r; S.profile.rounds = r; commitProfile(); commitSession(s); render(); break; }
    case "mic": { S.micHint = true; render(); const t = $("#sessionNote"); if (t) t.focus(); break; }
    case "cday": { const d = Number(b.dataset.d), sc = S.profile.condSchedule || []; S.profile.condSchedule = sc.includes(d) ? sc.filter(x => x !== d) : [...sc, d].sort(); commitProfile(); render(); break; }
    case "day": { const d = Number(b.dataset.d), sc = S.profile.schedule; S.profile.schedule = sc.includes(d) ? sc.filter(x => x !== d) : [...sc, d].sort(); commitProfile(); render(); break; }
    case "backup": backup(b); break;
    case "sync-on": {
      const url = ($("#syncUrl")?.value || "").trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)){ Sync.err = "To nie wygląda na adres z Apps Script. Powinien zaczynać się od https://script.google.com/macros/s/ i kończyć na /exec."; render(); break; }
      S.busy = true; Sync.err = null; render();
      Sync.connect(url).then(ok => { S.busy = false; if (!ok){ Sync.disconnect(); Sync.err = "Nie udało się połączyć. Sprawdź, czy wdrożenie ma dostęp „Każdy”, i spróbuj jeszcze raz."; } render(); });
      break;
    }
    case "sync-now": Sync.pull().then(() => render()); break;
    case "sync-off": S.sheet = {type:"confirm", title:"Odłączyć arkusz?", text:"Dane w arkuszu zostaną. Nowe sesje będą zapisywać się tylko w telefonie.", act:"sync-off-yes", yes:"Odłącz", no:"Anuluj"}; renderSheet(); break;
    case "sync-off-yes": Sync.disconnect(); S.sheet = null; render(); break;
    case "reset": S.sheet = {type:"confirm", title:"Przywrócić plan startowy?", text:"Ćwiczenia, ciężary i powtórzenia wrócą do planu startowego. Historia zostaje.", act:"reset-yes", yes:"Przywróć", no:"Anuluj"}; renderSheet(); break;
    case "reset-yes": S.profile.slots = DEFAULT_SLOTS.map(x => ({...x})); S.profile.rounds = 3; commitProfile(); S.sheet = null; render(); break;
    case "close": S.sheet = null; renderSheet(); break;
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.note){ const s = current(); s.note = e.target.value; commitSession(s, true); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.eq){ S.profile.equip[t.dataset.eq] = t.checked; commitProfile(); render(); }
  if (t.id === "importFile" && t.files && t.files[0]) importBackup(t.files[0]);
});
// Swipe the week strip left/right to change week.
let wkTouch = null;
document.addEventListener("touchstart", e => { wkTouch = e.target.closest(".wk-strip") ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, {passive:true});
document.addEventListener("touchend", e => {
  if (!wkTouch) return; const t = e.changedTouches[0], dx = t.clientX - wkTouch[0], dy = t.clientY - wkTouch[1]; wkTouch = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)){ const btn = document.querySelector(`[data-act=wk][data-d="${dx < 0 ? 1 : -1}"]`); if (btn && !btn.disabled) btn.click(); }
}, {passive:true});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet){ S.sheet = null; renderSheet(); } });

/* ---------- boot ---------- */
Store.init();
Sync.init();
{ const data = Store.load(); S.profile = mergeProfile(data.profile); S.sessions = data.sessions || {};
  if (data.profile && Array.isArray(data.profile.slots) && (DEFAULT_SLOTS.some(d => !data.profile.slots.some(x => x.key === d.key)) || (data.profile.mig || 0) < MIG)) commitProfile();
  try { S.reviews = JSON.parse(localStorage.getItem("trening:reviews") || "{}"); } catch(e){ S.reviews = {}; } }
S.loaded = true;
document.body.classList.remove("loading");
render();
Sync.pull().then(changed => { if (changed && ["home", "prep", "detail", "plan", "progress"].includes(S.view)) render(); });
// New version check: an installed iPhone app often resumes instead of restarting, so look for a newer index.html
// whenever the app comes back to the screen, and reload if it is safe (not while writing a note or waiting for a review).
let lastVersionCheck = 0;
async function checkForUpdate(){
  if (!navigator.onLine || location.protocol !== "https:" || Date.now() - lastVersionCheck < 60000) return;
  lastVersionCheck = Date.now();
  try {
    const html = await (await fetch("index.html", {cache:"no-store"})).text();
    const m = html.match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION && S.view !== "note" && !S.sheet && !S.reviewing) location.reload();
  } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkForUpdate(); });
setTimeout(checkForUpdate, 3000);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).catch(() => {});
</script>
